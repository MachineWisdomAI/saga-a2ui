name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The Lynx fixture is its own project with its own lockfile, outside the SDK workspace (see README).
      - run: npm ci --prefix apps/lynx-fixture
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
