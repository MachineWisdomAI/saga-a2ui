<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      No Content-Security-Policy here: the host applies the one the server publishes with this
      resource (a closed view: no network, no external resource).
    -->
    <title>SAGA starter</title>
  </head>
  <body>
    <p role="status" data-testid="view-status"></p>
    <!-- An application-owned input. The Clear control below it is a rendered SAGA component. -->
    <label>Note <input type="text" data-testid="note" /></label>
    <div id="root"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
